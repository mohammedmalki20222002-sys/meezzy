<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <!-- iOS composites a transparent icon onto black, so this one has a white ground. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Search Console ownership for the www.iptvmeezzy.app property. scripts/prerender.ts
         copies this <head> onto every prerendered page, so the tag is present wherever
         Google looks for it. -->
    <meta name="google-site-verification" content="D2iZAF1b9z6QTvxu82zcghWc2yBNNRAM97J8BBKsUwA" />
    <!-- TODO: add the msvalidate.01 token once a Bing Webmaster property exists. -->

    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <!-- Canonical host is www: the host 308-redirects the apex iptvmeezzy.app to
         www.iptvmeezzy.app, so every canonical / og:url / sitemap entry must use www
         or Search Console reports the submitted URLs as "Page with redirect". -->
    <link rel="canonical" href="https://www.iptvmeezzy.app/" />
    <title>MEEZZY — Premium IPTV Abonnement Deutschland</title>

    <!-- Google tag (gtag.js). scripts/prerender.ts copies this <head> into all
         ~950 prerendered pages, so the tag ships on the homepage, /blog and every
         post. TODO: create a GA4 property for www.iptvmeezzy.app and paste its
         G-XXXXXXXXXX measurement id in below, then uncomment.
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XXXXXXXXXX');
    </script>
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
